<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 132" width="860" height="132">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace} .h{font-size:13.5px;font-weight:700} .d{font-size:11.5px;fill:#c9d1d9}
.f{opacity:0;animation:f .6s ease-out forwards}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
<g class="f" style="animation-delay:0.00s"><rect x="0.5" y=".5" width="271" height="131" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="18" y="20" width="26" height="4" rx="2" fill="#7ee787"/><text x="18" y="46" class="h" fill="#7ee787">Validate before you transform</text><text x="18" y="66" class="d">Pandera checks on raw tables: non-</text><text x="18" y="83" class="d">null keys, valid statuses, positive</text><text x="18" y="100" class="d">prices.</text></g>
<g class="f" style="animation-delay:0.20s"><rect x="294.5" y=".5" width="271" height="131" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="312" y="20" width="26" height="4" rx="2" fill="#ff7b72"/><text x="312" y="46" class="h" fill="#ff7b72">Guard what AI generates</text><text x="312" y="66" class="d">LLM-written SQL must pass SELECT-</text><text x="312" y="83" class="d">only guardrails before touching the</text><text x="312" y="100" class="d">database.</text></g>
<g class="f" style="animation-delay:0.40s"><rect x="588.5" y=".5" width="271" height="131" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="606" y="20" width="26" height="4" rx="2" fill="#79c0ff"/><text x="606" y="46" class="h" fill="#79c0ff">Show your work</text><text x="606" y="66" class="d">The UI displays the exact SQL that</text><text x="606" y="83" class="d">ran, so every answer can be audited.</text></g></svg>